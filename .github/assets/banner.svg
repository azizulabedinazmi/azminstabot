<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".3" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset=".85" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient>
    <path id="heart" d="M0 6C-6-6-22-2-22 10c0 12 22 24 22 24S22 22 22 10C22-2 6-6 0 6z"/>
    <style>.h{animation:up 4s ease-in infinite;opacity:0}.h2{animation-delay:-1.3s}.h3{animation-delay:-2.6s}@keyframes up{0%{opacity:0;transform:translateY(40px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-180px) scale(1.1)}}</style>
  </defs>
  <rect width="1200" height="320" fill="url(#ig)"/>
  <!-- phone -->
  <g transform="translate(840 22)">
    <rect width="180" height="300" rx="28" fill="#111"/>
    <rect x="10" y="12" width="160" height="290" rx="20" fill="#fff"/>
    <circle cx="36" cy="44" r="14" fill="none" stroke="url(#ig)" stroke-width="3"/>
    <rect x="58" y="38" width="70" height="10" rx="5" fill="#e5e7eb"/>
    <rect x="10" y="70" width="160" height="140" fill="#fde2e4"/>
    <g transform="translate(90 132)"><circle r="26" fill="#111" opacity=".85"/><path d="M-9-14 15 0-9 14z" fill="#fff"/></g>
    <use href="#heart" x="32" y="228" fill="#ef4444" transform="translate(-6 0) scale(.9)"/>
    <rect x="64" y="234" width="80" height="9" rx="4" fill="#e5e7eb"/><rect x="28" y="258" width="120" height="9" rx="4" fill="#f3f4f6"/>
  </g>
  <g fill="#fff">
    <g transform="translate(1080 220)"><use class="h" href="#heart"/></g>
    <g transform="translate(1120 250)"><use class="h h2" href="#heart"/></g>
    <g transform="translate(790 240)"><use class="h h3" href="#heart"/></g>
  </g>
  <!-- bot head -->
  <g transform="translate(70 70)">
    <rect width="84" height="70" rx="18" fill="#fff" fill-opacity=".2" stroke="#fff" stroke-width="4"/>
    <circle cx="28" cy="34" r="8" fill="#fff"/><circle cx="56" cy="34" r="8" fill="#fff"/>
    <line x1="42" y1="0" x2="42" y2="-16" stroke="#fff" stroke-width="4"/><circle cx="42" cy="-20" r="6" fill="#fff"/>
    <path d="M26 54h32" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="180" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#fff">InstaBot</text>
  <text x="72" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#fff" opacity=".95">scheduled likes · follows · comments — in Python</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#fff">
    <rect x="72" y="232" width="150" height="30" rx="15" fill="#000" fill-opacity=".2"/><text x="147" y="252" text-anchor="middle">like_per_day</text>
    <rect x="232" y="232" width="170" height="30" rx="15" fill="#000" fill-opacity=".2"/><text x="317" y="252" text-anchor="middle">follow_per_day</text>
    <rect x="412" y="232" width="190" height="30" rx="15" fill="#000" fill-opacity=".2"/><text x="507" y="252" text-anchor="middle">comments_per_day</text>
  </g>
</svg>
